name: PR gate

# Required check. Verifies that the pull request carries generated, commit-bound evidence of a completed
# independent Codex review of exactly the commit being checked (docs/DEVELOPMENT.md), plus branch naming.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# A newer run for the same PR (new commit or body edit) supersedes older ones, so a stale result can
# never be the latest one.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate script always comes from the base branch, so a PR cannot weaken its own gate.
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Check Codex review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/ci/pr-gate.sh
